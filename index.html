<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Parent–Teacher Conferences · NIS</title><style>
:root{--red:#8C0E06;--ink:#303234;--text:#64676A;--line:#BCBCBC;--surface:#F5F5F4;--soft:#ECECEB;--white:#FFFFFF;font-family:Arial,Helvetica,sans-serif;color:var(--text);background:var(--surface)}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:28px}.landing{width:min(100%,720px);text-align:center}.logo{display:block;width:270px;max-width:68vw;height:auto;margin:0 auto 32px}.eyebrow{font-size:10px;letter-spacing:.15em;text-transform:uppercase;font-weight:700;margin:0 0 8px}.landing h1{font-size:clamp(29px,5vw,40px);line-height:1.15;letter-spacing:-.04em;color:var(--ink);font-weight:600;margin:0}.intro{font-size:14px;line-height:1.5;margin:11px auto 31px;max-width:470px}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;text-align:left}.choice{min-height:184px;background:var(--white);border:.5px solid var(--line);border-radius:13px;padding:24px;text-decoration:none;color:var(--text);display:flex;flex-direction:column;align-items:flex-start;transition:border-color .15s,transform .15s,box-shadow .15s}.choice:hover{border-color:var(--text);transform:translateY(-2px);box-shadow:0 8px 22px rgba(48,50,52,.08)}.choice:focus-visible{outline:2px solid var(--ink);outline-offset:3px}.icon{width:43px;height:43px;border-radius:10px;background:var(--soft);display:grid;place-items:center;margin-bottom:22px}.icon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.parents .icon{color:var(--red)}.staff .icon{color:var(--text)}.choice h2{font-size:19px;line-height:1.25;color:var(--ink);font-weight:600;margin:0}.choice p{font-size:12px;line-height:1.5;margin:7px 0 0}.arrow{margin-top:auto;padding-top:18px;color:var(--text);font-size:17px}.footer{font-size:10px;margin:24px 0 0}.admin-link{color:var(--text);text-underline-offset:3px}@media(max-width:520px){body{padding:22px 15px}.logo{width:225px;margin-bottom:27px}.intro{font-size:13px;margin-bottom:2 </style></head><body><main class="landing"><img class="logo" src="assets/nis-primary-horizontal.png" alt="Nakornpayap International School"><p class="eyebrow">Welcome to NIS</p><h1>Parent–Teacher Conferences</h1><p class="intro">Choose where you’d like to go for the upcoming conference day.</p><div class="choices"><a class="choice parents" href="nis-ptc-parent.html"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.7-4.3 3-6.5 7-6.5s6.3 2.2 7 6.5"/></svg></span><h2>Parents</h2><p>Book or manage a meeting with your child’s teacher.</p><span class="arrow" aria-hidden="true">→</span></a><a class="choice staff" href="nis-ptc-teacher.html"><span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.25"/><circle cx="17.5" cy="10" r="2.25"/><path d="M2.5 20c.6-4.2 2.7-6.4 6.5-6.4s5.9 2.2 6.5 6.4M15 15c3.5-.8 5.7.8 6.5 4.5"/></svg></span><h2>Teachers &amp; Staff</h2><p>View your conference day and manage your schedule.</p><span class="arrow" aria-hidden="true">→</span></a></div><p class="footer">IT administrator? <a class="admin-link" href="nis-ptc-admin.html">Open the admin workspace</a></p></main></body></html>
